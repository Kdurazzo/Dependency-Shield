server {
    listen 80;
    server_name localhost;

    # Static assets for DepShield Glassmorphism Dashboard
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy to DepShield backend service
    location /api/ {
        proxy_pass http://depshield-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward custom DepShield headers
        proxy_pass_request_headers on;

        # Timeouts for deep recursive dependency audits
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Lightweight healthcheck endpoint for Docker
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
